name: Pulse
options:
  bundleIdPrefix: com.pulse
  deploymentTarget:
    iOS: '17.0'
targets:
  Pulse:
    type: application
    platform: iOS
    sources: [Pulse]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.personal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_NSHealthShareUsageDescription: Pulse reads steps, heart rate, sleep, blood oxygen, HRV, sleeping wrist temperature and weight to show your wellbeing dashboard.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.0'
        CODE_SIGN_ENTITLEMENTS: Pulse/Pulse.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  PulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PulseUITests]
    dependencies:
      - target: Pulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  Pulse:
    build:
      targets:
        Pulse: all

    test:
      targets: [PulseUITests]
